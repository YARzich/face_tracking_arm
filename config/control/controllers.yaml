# Gazebo ros2_control and the single trajectory controller used by MoveIt Servo.
controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lite6_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

lite6_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    interpolate_from_desired_state: true
    # The safety adapter consumes this feedback every 10 ms. Keep the
    # controller-state publication on the same grid so a missed sample is
    # detected within the configured 20 ms freshness window.
    state_publish_rate: 100.0
    # Position-only collision-aware commands are linearly interpolated. This
    # avoids the one-point look-ahead semantics of the "none" mode.
    interpolation_method: splines
    action_monitor_rate: 20.0
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.01
