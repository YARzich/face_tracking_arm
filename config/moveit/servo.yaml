# MoveIt Servo ROS interface. This package does not launch move_group.
thread_priority: 40
publish_period: 0.01
max_expected_latency: 0.05
move_group_name: lite6_arm

pose_command_in_topic: ~/pose_target_cmds
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
status_topic: ~/status
command_out_topic: /lite6_arm_controller/joint_trajectory
joint_topic: /joint_states

command_in_type: speed_units
scale:
  linear: 0.10
  rotational: 1.2
  joint: 0.5
incoming_command_timeout: 0.10
apply_twist_commands_about_ee_frame: true
pose_tracking:
  linear_tolerance: 0.001
  angular_tolerance: 0.01

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: true

monitored_planning_scene_topic: /planning_scene
is_primary_planning_scene_monitor: true
check_octomap_collisions: false
use_smoothing: true
smoothing_filter_plugin_name: online_signal_smoothing::AccelerationLimitedPlugin

check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
# The exact REST IK has a measured Jacobian condition number of 31.71 on Lite 6.
# A sampled +/- 5 cm workspace around it supports this robot-specific warning band.
lower_singularity_threshold: 40.0
hard_stop_singularity_threshold: 80.0
leaving_singularity_threshold_multiplier: 2.0
singularity_step_scale: 0.01
halt_all_joints_in_joint_mode: true
halt_all_joints_in_cartesian_mode: true
joint_limit_margins: [0.10]
override_velocity_scaling_factor: 0.0
